services:
  db:
    image: postgres:16
    container_name: fitness-db
    restart: unless-stopped     # sobe sozinho no boot do PC
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fit}
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
    ports:
      - "5434:5432"          # host 5434 -> container 5432 (5432/5433 ja ocupados nesta maquina)
    volumes:
      - pgdata:/var/lib/postgresql/data   # persiste dados entre down/up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fit} -d ${POSTGRES_DB:-fitness}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: fitness-api
    restart: unless-stopped     # sobe sozinho no boot do PC
    depends_on:
      db:
        condition: service_healthy   # espera o Postgres ficar pronto
    environment:
      # dentro da rede do compose a API fala com o servico "db" na porta interna 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fit}:${POSTGRES_PASSWORD:-fit}@db:5432/${POSTGRES_DB:-fitness}
    ports:
      - "8000:8000"
    volumes:
      - .:/app                 # hot-reload: codigo da maquina reflete no container
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
